name: Merovingio v5 - Dynamic Opposition REBASE

on:
  push:
    branches:
      - 'experiment/dynamic-opposition-rebase-v5'
    paths:
      - 'NMerovingio/experiments/gestalt_heat_v5/**'
      - '.github/workflows/dynamic-opposition-rebase-v5.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dynamic-rebase:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test dynamic graph salience, novelty and false-inference barriers
        run: python -m unittest discover -s NMerovingio/experiments/gestalt_heat_v5 -p 'test_*.py' -v
      - name: Four-step selective search (primary benchmark)
        run: python NMerovingio/experiments/gestalt_heat_v5/dynamic.py --seeds 32 --budget 4
      - name: Eight-step saturation control
        run: python NMerovingio/experiments/gestalt_heat_v5/dynamic.py --seeds 32 --budget 8 --output NMerovingio/experiments/gestalt_heat_v5/results/saturation
      - name: Build interactive viewer and measured report
        run: |
          python NMerovingio/experiments/gestalt_heat_v5/viewer.py
          python NMerovingio/experiments/gestalt_heat_v5/compare_budgets.py
      - name: Upload sanitized cognitive traces and viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merovingio-dynamic-opposition-rebase-v5
          path: NMerovingio/experiments/gestalt_heat_v5/results/
          retention-days: 30
