name: Panoptikon - Causal Graph Genealogy v1.2

on:
  push:
    branches:
      - 'experiment/panoptikon-causal-graph-v1.2'
    paths:
      - 'NMerovingio/causal_graph_v12/**'
      - '.github/workflows/panoptikon-causal-graph-v12.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: panoptikon-causal-v12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: NMerovingio/causal_graph_v12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install runtime dependencies
        run: python -m pip install requests
      - name: Offline geometry and causal-graph controls
        run: python -m unittest discover -s tests -v
      - name: Run 32 Jev judgments with securely scoped key
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python graph_genealogy_v12.py output
      - name: Publish sanitized results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: panoptikon-causal-graph-v12
          path: NMerovingio/causal_graph_v12/output/jev_causal_graph_v12.json
          retention-days: 7