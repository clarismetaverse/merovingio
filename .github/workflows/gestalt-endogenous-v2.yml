name: Merovingio v2 - Endogenous Gestalt Propagation

on:
  push:
    branches:
      - 'experiment/gestalt-endogenous-regrouping-v2'
    paths:
      - 'NMerovingio/experiments/gestalt_heat_v2/**'
      - '.github/workflows/gestalt-endogenous-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  graph-grammar-ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test graph derivation, analogical provenance and epistemic barriers
        run: python -m unittest discover -s NMerovingio/experiments/gestalt_heat_v2 -p 'test_*.py' -v
      - name: Execute four conditions x two geometric modes x 32 seeds
        run: python NMerovingio/experiments/gestalt_heat_v2/endogenous.py --seeds 32 --budget 16
      - name: Generate offline interactive trace explorer and report
        run: python NMerovingio/experiments/gestalt_heat_v2/viewer.py
      - name: Upload executed experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merovingio-gestalt-endogenous-v2
          path: NMerovingio/experiments/gestalt_heat_v2/results/
          retention-days: 30
