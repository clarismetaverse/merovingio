name: Jev Vision - Unannotated vs Symbolic v0.9
on:
  push:
    branches: ['experiment/jev-unannotated-symbolic-v0.9']
    paths:
      - 'experiments/jev_i10_maxblend_v03/**'
      - '.github/workflows/jev-unannotated-symbolic-v09.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: experiments/jev_i10_maxblend_v03
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Local tests
        run: python -m unittest discover -s tests -v
      - name: Evaluate vision and symbolic descriptions
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: python src/unannotated_symbolic_v09.py output_v09
      - name: Export experiment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jev-unannotated-symbolic-v09
          path: |
            experiments/jev_i10_maxblend_v03/output_v09/unannotated_symbolic_results.json
            experiments/jev_i10_maxblend_v03/output_v09/images/*.png
          retention-days: 7
