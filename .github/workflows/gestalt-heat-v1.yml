name: Merovingio Gestalt Heat v1 (no model calls)
on:
  push:
    branches:
      - 'experiment/gestalt-macro-micro-heat-v1'
    paths:
      - 'NMerovingio/experiments/gestalt_heat_v1/**'
      - '.github/workflows/gestalt-heat-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cognitive-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify geometry, provenance, epistemic barriers and feedback
        run: python -m unittest discover -s NMerovingio/experiments/gestalt_heat_v1 -p 'test_*.py' -v
      - name: Three ablations x two triangle geometries x 48 seeds
        run: python NMerovingio/experiments/gestalt_heat_v1/engine.py --seeds 48 --budget 12
      - name: Build offline interactive viewer and report
        run: python NMerovingio/experiments/gestalt_heat_v1/viewer.py
      - name: Upload traces, comparison, viewer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merovingio-gestalt-heat-v1
          path: NMerovingio/experiments/gestalt_heat_v1/results/
          retention-days: 30
